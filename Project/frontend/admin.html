<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="navbar">

        <div class="logo">
            🩸 Blood Bank
        </div>

        <button
            class="logout-btn"
            onclick="logout()">
            Logout
        </button>

    </header>


    <main class="dashboard">

        <h1>Admin Dashboard</h1>


        <div class="admin-cards">

            <div class="dashboard-card">
                <h2>👥 Donors</h2>
                <p id="donorCount">Loading...</p>
            </div>


            <div class="dashboard-card">
                <h2>🏥 Hospitals</h2>
                <p id="hospitalCount">Loading...</p>
            </div>


            <div class="dashboard-card">
                <h2>🩸 Blood Inventory</h2>
                <p id="inventoryCount">Loading...</p>
            </div>


            <div class="dashboard-card">
                <h2>📋 Blood Requests</h2>
                <p id="requestCount">Loading...</p>
            </div>

        </div>


        <h2>Blood Requests</h2>

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Hospital</th>
                    <th>Blood Group</th>
                    <th>Units</th>
                    <th>Urgency</th>
                    <th>Status</th>
                    <th>Date</th>

                </tr>

            </thead>


            <tbody id="adminRequestTable">

                <tr>

                    <td colspan="7">
                        Loading...
                    </td>

                </tr>

            </tbody>

        </table>

    </main>


    <script src="script.js"></script>

</body>

</html>
