<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Donor Registration</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;

            font-family: Arial, sans-serif;

            background: #f5f6fa;
        }

        .container {
            width: 500px;

            max-width: 90%;

            margin: 50px auto;

            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;

            color: #c41230;

            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;

            margin-bottom: 6px;

            font-weight: bold;
        }

        input,
        select {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 16px;
        }

        button {
            width: 100%;

            padding: 13px;

            margin-top: 10px;

            background: #c41230;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #a80f29;
        }

        #message {
            text-align: center;

            margin-top: 15px;

            font-weight: bold;
        }

        .login {
            text-align: center;

            margin-top: 20px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Donor Registration</h1>

    <form id="registerForm">

        <!-- NAME -->

        <div class="form-group">

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                required
            >

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                required
            >

        </div>


        <!-- PHONE -->

        <div class="form-group">

            <label for="phone">
                Phone
            </label>

            <input
                type="text"
                id="phone"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                required
            >

        </div>


        <!-- ROLE -->

        <div class="form-group">

            <label for="role">
                Role
            </label>

            <select id="role">

                <option value="donor">
                    Donor
                </option>

            </select>

        </div>


        <!-- BLOOD GROUP -->

        <div class="form-group">

            <label for="blood_group">
                Blood Group
            </label>

            <select id="blood_group" required>

                <option value="">
                    Select Blood Group
                </option>

                <option value="A+">A+</option>

                <option value="A-">A-</option>

                <option value="B+">B+</option>

                <option value="B-">B-</option>

                <option value="AB+">AB+</option>

                <option value="AB-">AB-</option>

                <option value="O+">O+</option>

                <option value="O-">O-</option>

            </select>

        </div>


        <!-- AGE -->

        <div class="form-group">

            <label for="age">
                Age
            </label>

            <input
                type="number"
                id="age"
                min="18"
                required
            >

        </div>


        <!-- GENDER -->

        <div class="form-group">

            <label for="gender">
                Gender
            </label>

            <select id="gender" required>

                <option value="">
                    Select Gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        <!-- ADDRESS -->

        <div class="form-group">

            <label for="address">
                Address
            </label>

            <input
                type="text"
                id="address"
                required
            >

        </div>


        <!-- REGISTER -->

        <button type="submit">
            Register
        </button>

    </form>


    <div id="message"></div>


    <div class="login">

        Already registered?

        <a href="login.html">
            Login
        </a>

    </div>

</div>


<script>

document
.getElementById("registerForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const message =
        document.getElementById("message");

    message.style.color = "black";

    message.innerText =
        "Registering...";


    // ==========================================
    // GET FORM DATA
    // ==========================================

    const data = {

        name:
            document.getElementById("name").value,

        email:
            document.getElementById("email").value,

        phone:
            document.getElementById("phone").value,

        password:
            document.getElementById("password").value,

        blood_group:
            document.getElementById("blood_group").value,

        age:
            document.getElementById("age").value,

        gender:
            document.getElementById("gender").value,

        address:
            document.getElementById("address").value

    };


    console.log("Sending data:", data);


    try {

        // ==========================================
        // SEND TO BACKEND
        // ==========================================

        const response = await fetch(
            "http://localhost:5000/api/donors/register",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(data)
            }
        );


        const result =
            await response.json();


        console.log(
            "Backend response:",
            result
        );


        // ==========================================
        // SUCCESS
        // ==========================================

        if (response.ok && result.success) {

            message.style.color = "green";

            message.innerText =
                "Donor registered successfully!";

            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 1500);

        }

        // ==========================================
        // ERROR
        // ==========================================

        else {

            message.style.color = "red";

            message.innerText =
                result.message ||
                "Registration failed";

        }

    }

    catch (error) {

        console.error(
            "Registration error:",
            error
        );

        message.style.color = "red";

        message.innerText =
            "Cannot connect to backend. Make sure server.js is running.";

    }

});

</script>

</body>

</html>
